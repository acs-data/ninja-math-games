name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject cache version into Service Worker
        # Remplace __CACHE_VERSION__ par le SHA court du commit pour invalider
        # automatiquement le cache PWA à chaque déploiement.
        run: |
          SHA_SHORT="${GITHUB_SHA:0:8}"
          sed -i "s|__CACHE_VERSION__|${SHA_SHORT}|g" sw.js
          echo "Cache version set to: amat-${SHA_SHORT}"
          grep "CACHE_NAME" sw.js

      - name: Rebuild main page (index.html)
        # Reconstruit index.html (la page principale : l'édition animée) depuis le classique.html déployé.
        # Cette étape ne fait JAMAIS échouer le déploiement ; elle dit ce qu'elle a trouvé par des annotations :
        #   1. « --check » : l'index.html versionné correspond-il à classique.html et à anime-src/ ?
        #      Sinon il a été versionné sans être reconstruit : avertissement (la version déployée
        #      est alors celle reconstruite ici, que la suite de tests n'a pas vue).
        #   2. Reconstruction. Les avertissements du build deviennent des annotations
        #      (GITHUB_ACTIONS=true). Si la construction est refusée (lint, syntaxe, ou un nom dont
        #      le noyau de la couche ou l'arène du QCM dépend a disparu de classique.html), rien n'est
        #      écrit : c'est l'index.html VERSIONNÉ qui est déployé — une page principale qui peut
        #      donc être plus ancienne que le jeu classique (classique.html), mais cohérente — et une
        #      annotation d'erreur le dit.
        run: |
          etat=0
          python3 tools/build_anime.py --check > /dev/null 2>&1 || etat=$?
          if [ "$etat" = "1" ]; then
            echo "::warning title=Page principale (index.html)::L'index.html versionné n'était pas à jour (classique.html ou anime-src/ modifié sans reconstruction) : il est reconstruit pour ce déploiement, sans avoir été testé. À faire en local : python3 tools/build_anime.py && node tools/test_anime.js, puis versionner index.html."
          fi
          if ! python3 tools/build_anime.py; then
            echo "::error title=Page principale (index.html)::Construction refusée : l'index.html versionné est conservé et déployé tel quel. La page principale peut être plus ancienne que le jeu classique déployé (elle embarque le classique.html de sa dernière construction). Cause : voir l'annotation de build_anime.py et le journal de cette étape."
          fi
          chmod 644 index.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sert tout le dépôt à la racine (index.html = page principale générée, classique.html = jeu classique, anime.html = redirection)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
